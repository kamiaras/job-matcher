# Deterministic filter branch (no LLM)

name: Deterministic Job Filter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deterministic filter
        run: python scraper.py

      - name: Upload candidates.json
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: candidates.json
